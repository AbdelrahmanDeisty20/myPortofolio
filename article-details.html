  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await loadArticle();
    });

    window.refreshPageData = async () => {
      await loadArticle();
    };

    async function loadArticle() {
      const container = document.getElementById('articleContainer');
      const urlParams = new URLSearchParams(window.location.search);
      let slug = urlParams.get('slug');

      if (!slug) slug = 'designing-resilient-webhook-handlers-laravel';

      const article = await PortfolioAPI.getArticleBySlug(slug);

      if (!article) {
        container.innerHTML = `
          <div class="container section-wrapper" style="text-align: center; padding: 6rem 1.5rem;">
            <h1 class="hero-headline">Article Not Found</h1>
            <p style="margin: 1rem 0 2rem; color: var(--text-secondary);">The requested article record could not be located.</p>
            <a href="./articles.html" class="btn btn-primary">Browse All Notes</a>
          </div>
        `;
        return;
      }

      document.title = `${article.title} — Engineering Notes | Abdelrahman El-Deisty`;

      // Simple Markdown converter for headers, codeblocks, backticks, bold
      const htmlContent = formatMarkdown(article.content || article.excerpt);

      container.innerHTML = `
        <div class="article-header">
          <div class="container article-container">
            <a href="./articles.html" class="case-back-link">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
              <span>Back to all notes</span>
            </a>

            <div style="display: flex; gap: 0.65rem; align-items: center; margin-bottom: 1rem;">
              <span class="badge badge-indigo">${escapeHtml(article.category)}</span>
              <span style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted);">${escapeHtml(article.readTime)} • ${escapeHtml(article.date)}</span>
            </div>

            <h1 class="case-title" style="font-size: clamp(2rem, 3.5vw, 2.8rem);">${escapeHtml(article.title)}</h1>
          </div>
        </div>

        <div class="container article-container">
          <div style="margin-top: 2rem; border-radius: var(--radius-xl); overflow: hidden; border: 1px solid var(--border-medium); max-height: 400px;">
            <img src="${article.coverImage}" alt="${escapeHtml(article.title)}" style="width: 100%; height: 100%; object-fit: cover;">
          </div>

          <div class="article-content">
            ${htmlContent}
          </div>

          <!-- Tags & Share -->
          <div style="padding: 1.5rem 0; border-top: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div style="display: flex; gap: 0.45rem; flex-wrap: wrap;">
              ${(article.tags || []).map(t => `<span class="badge">${escapeHtml(t)}</span>`).join('')}
            </div>
            <a href="./contact.html" class="btn btn-sm btn-outline">Discuss this Article with Abdelrahman →</a>
          </div>
        </div>
      `;
    }

    function formatMarkdown(md) {
      if (!md) return '';
      let text = md;

      // Code blocks ```lang ... ```
      text = text.replace(/```([a-z]*)\n([\s\S]*?)```/g, (match, lang, code) => {
        return `<pre><code>${escapeHtml(code.trim())}</code></pre>`;
      });

      // Headers
      text = text.replace(/^### (.*$)/gim, '<h3>$1</h3>');
      text = text.replace(/^## (.*$)/gim, '<h2>$1</h2>');
      text = text.replace(/^# (.*$)/gim, '<h1>$1</h1>');

      // Bold & Italic
      text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');

      // Inline code
      text = text.replace(/`([^`]+)`/g, '<code>$1</code>');

      // Paragraphs
      const paragraphs = text.split('\n\n').map(p => {
        p = p.trim();
        if (!p) return '';
        if (p.startsWith('<h') || p.startsWith('<pre') || p.startsWith('<ul') || p.startsWith('<li')) {
          return p;
        }
        return `<p>${p}</p>`;
      });

      return paragraphs.join('\n');
    }
  </script>
